services:
  juice-shop:
    image: ${JUICE_SHOP_IMAGE:-bkimminich/juice-shop:v20.2.0}
    container_name: juice-shop
    networks:
      - test-net
    expose:
      - '3000'

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: test-runner
    networks:
      - test-net
    environment:
      - BASE_URL=http://juice-shop:3000
      - CI=true
    volumes:
      # Directories only: bind-mounting a non-existent file makes Docker create a directory in its place.
      - ./allure-results:/app/allure-results
      - ./test-results:/app/test-results
      - ./reports:/app/reports
    depends_on:
      - juice-shop
    command: >
      sh -c "node scripts/wait-for-app.mjs http://juice-shop:3000/rest/admin/application-version 120
      && npx playwright test"

networks:
  test-net:
    driver: bridge
