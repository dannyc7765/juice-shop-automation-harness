name: E2E Regression & Telemetry

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-sharded:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]
    services:
      juice-shop:
        image: bkimminich/juice-shop:latest
        ports:
          - 3000:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Await Juice Shop Readiness
        run: |
          node -e '
            const check = () => fetch("http://localhost:3000/rest/admin/application-version")
              .then(res => {
                if (!res.ok) throw new Error("HTTP " + res.status);
                console.log("Juice Shop ready on port 3000.");
                process.exit(0);
              })
              .catch(() => {
                console.log("Waiting for service...");
                setTimeout(check, 1000);
              });
            check();
          '

      - name: Execute Tests (Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        env:
          BASE_URL: http://localhost:3000
          CI: true
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload Shard Test Artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-shard-${{ matrix.shardIndex }}
          path: |
            test-results/
            flaky-tests.json
          retention-days: 7

      - name: Upload Raw Allure Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-shard-${{ matrix.shardIndex }}
          path: allure-results/
          retention-days: 7

  generate-report:
    name: Consolidate & Deploy Allure
    needs: test-sharded
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Allure CLI
        run: npm install -g allure-commandline

      - name: Download all raw Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-shard-*
          path: consolidated-allure-results
          merge-multiple: true

      - name: Checkout gh-pages for History Preservation
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-branch

      - name: Restore Allure History
        run: |
          if [ -d "gh-pages-branch/history" ]; then
            cp -r gh-pages-branch/history consolidated-allure-results/
          fi
          if [ -f "categories.json" ]; then
            cp categories.json consolidated-allure-results/categories.json
          fi

      - name: Generate Consolidated HTML Report
        run: allure generate consolidated-allure-results --clean -o allure-report

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: allure-report
          branch: gh-pages