name: E2E Regression & Telemetry

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  static-checks:
    name: Lint & typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  smoke:
    name: Smoke (fast gate)
    needs: static-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      juice-shop:
        image: bkimminich/juice-shop:v20.2.0
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        ports:
          - 3000:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/wait-for-app.mjs http://localhost:3000/rest/admin/application-version 120
      - name: Run @smoke tests
        env:
          BASE_URL: http://localhost:3000
        run: npm run test:smoke
      - name: Upload traces and videos
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  test-sharded:
    needs: [static-checks, smoke]
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]
    services:
      juice-shop:
        # Pinned to the version the suite was validated against. Bump deliberately, not implicitly.
        image: bkimminich/juice-shop:v20.2.0
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        ports:
          - 3000:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Wait for Juice Shop
        run: node scripts/wait-for-app.mjs http://localhost:3000/rest/admin/application-version 120

      - name: Run tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        env:
          BASE_URL: http://localhost:3000
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Summarise flaky tests
        if: ${{ !cancelled() }}
        run: |
          if [ -f reports/flaky-tests.json ]; then
            echo "### Flaky tests (shard ${{ matrix.shardIndex }})" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat reports/flaky-tests.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload traces, videos and flaky report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-shard-${{ matrix.shardIndex }}
          path: |
            test-results/
            reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload raw Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-shard-${{ matrix.shardIndex }}
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 7

  generate-report:
    name: Consolidate & deploy Allure
    needs: test-sharded
    if: ${{ always() && needs.test-sharded.result != 'skipped' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write # needed only to push the gh-pages branch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install -g allure-commandline

      - uses: actions/download-artifact@v4
        with:
          pattern: allure-results-shard-*
          path: consolidated-allure-results
          merge-multiple: true

      - name: Checkout gh-pages for history
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-branch

      - name: Add history, categories and environment info
        run: |
          if [ -d gh-pages-branch/history ]; then
            cp -r gh-pages-branch/history consolidated-allure-results/
          fi
          cp categories.json consolidated-allure-results/categories.json
          {
            echo "Framework=Playwright $(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version" 2>/dev/null || echo unknown)"
            echo "Node.js=$(node --version)"
            echo "Target.Application=OWASP Juice Shop"
            echo "Shards=2"
          } > consolidated-allure-results/environment.properties

      - run: allure generate consolidated-allure-results --clean -o allure-report

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: allure-report
          branch: gh-pages
